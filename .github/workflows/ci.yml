name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies
      run: dotnet restore CloudServiceSolution.sln
      
    - name: Build
      run: dotnet build CloudServiceSolution.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test CloudService.Tests/CloudService.Tests.csproj --no-build --configuration Release --verbosity normal

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'cloud-service-frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./cloud-service-frontend
      run: npm ci || npm install
      
    - name: Build Next.js app
      working-directory: ./cloud-service-frontend
      run: npm run build
