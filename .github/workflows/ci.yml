name: "🚀 CI/CD Pipeline"

"on":
  push:
    branches: [ "main", "master"]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-backend:
    name: "🛠️ Build & Test Backend"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: "⚙️ Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
        
    - name: "📦 Restore dependencies"
      run: dotnet restore CloudServiceSolution.sln
      
    - name: "🔨 Build"
      run: dotnet build CloudServiceSolution.sln --no-restore --configuration Release
      
    - name: "🧪 Test"
      run: dotnet test CloudService.Tests/CloudService.Tests.csproj --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  build-frontend:
    name: "🖥️ Build Frontend"
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: "🟢 Setup Node.js"
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'cloud-service-frontend/package-lock.json'
        
    - name: "📥 Install dependencies"
      working-directory: ./cloud-service-frontend
      run: npm ci
      
    - name: "🏗️ Build Next.js app"
      working-directory: ./cloud-service-frontend
      run: npm run build

  docker-build:
    name: "🐳 Validate Docker images"
    needs: [build-and-test-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: "🐋 Validate development Compose configuration"
      run: |
        MSSQL_SA_PASSWORD='TestStrong!Passw0rd' \
        JWT_SECRET='test-only-jwt-secret-with-enough-length' \
        docker compose config

    - name: "🐋 Validate production Compose configuration"
      run: |
        MSSQL_SA_PASSWORD='TestStrong!Passw0rd' \
        JWT_SECRET='test-only-jwt-secret-with-enough-length' \
        API_IMAGE='cloudservice-api:test' \
        FRONTEND_IMAGE='cloudservice-frontend:test' \
        docker compose -f docker-compose.production.yml config

    - name: "📦 Build Docker images"
      run: |
        MSSQL_SA_PASSWORD='TestStrong!Passw0rd' \
        JWT_SECRET='test-only-jwt-secret-with-enough-length' \
        docker compose build

  deploy:
    name: "🚀 Deploy to VPS"
    needs: [docker-build]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - name: "☁️ Deploy via SSH"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          password: ${{ secrets.AZURE_PASSWORD }}
          script: |
            # Deploy đúng repository PTPM-Nhom5 vào thư mục riêng trên VPS.
            APP_DIR="/home/azureuser/PTPM-Nhom5"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/0023411852-crypto/PTPM-Nhom5.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Cập nhật đúng nhánh main từ repository 1111.
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # Production compose dùng image; build image từ source mới nhất trên server.
            export API_IMAGE="cloudservice-api:latest"
            export FRONTEND_IMAGE="cloudservice-frontend:latest"
            docker build -t "$API_IMAGE" -f CloudService.WebApi/Dockerfile .
            docker build -t "$FRONTEND_IMAGE" ./cloud-service-frontend

            # Tạo file .env trên server để cung cấp biến môi trường cho docker-compose
            echo "JWT_SECRET=CloudNovaSecretKey2026!@#$" > .env
            echo "MSSQL_SA_PASSWORD=CloudNovaStr0ngPassword!2026" >> .env

            # Dùng cấu hình production, không dùng compose development.
            docker compose -f docker-compose.production.yml down
            docker compose -f docker-compose.production.yml up -d

            # Xóa image trung gian/cũ để giải phóng bộ nhớ.
            docker image prune -f
