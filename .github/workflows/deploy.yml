name: Deploy directly to Server

on:
  push:
    branches: ["main", "master", "Linh-dev-1"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            # Di chuyển tới thư mục chứa mã nguồn trên server
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Cập nhật code mới nhất từ nhánh main
            git fetch origin
            git checkout main
            git reset --hard origin/main
            git pull origin main
            
            # Khởi động và build lại Docker containers
            docker compose down
            docker compose build
            docker compose up -d
            
            # Xóa các image cũ để giải phóng bộ nhớ
            docker image prune -f
