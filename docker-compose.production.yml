services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    image: "${API_IMAGE:?API_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "${API_PORT:-5154}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${DB_NAME:-CloudServiceDB};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET:?JWT_SECRET is required}"
      JwtSettings__Issuer: "${JWT_ISSUER:-CloudServiceApp}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-CloudServiceUsers}"
      JwtSettings__ExpirationInMinutes: "${JWT_EXPIRATION_MINUTES:-60}"
      DemoPayment__Enabled: "${DEMO_PAYMENT_ENABLED:-false}"
      Database__AutoMigrate: "${DATABASE_AUTO_MIGRATE:-false}"
    depends_on:
      sqlserver:
        condition: service_healthy

  seeder:
    image: "${SEEDER_IMAGE:-cloudservice-seeder:latest}"
    environment:
      - ConnectionString=Server=sqlserver,1433;Database=${DB_NAME:-CloudServiceDB_v2};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
    command: ["Server=sqlserver,1433;Database=${DB_NAME:-CloudServiceDB_v2};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"]

  frontend:
    image: "${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      API_PROXY_URL: http://api:8080
    depends_on:
      - api

volumes:
  sqlserver_data:
