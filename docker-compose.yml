services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: CloudService.WebApi/Dockerfile
    container_name: cloudservice-api
    ports:
      - "5154:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CloudServiceDB_v2;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET:-local-demo-secret-change-before-deploying-123456789}"
      JwtSettings__Issuer: CloudServiceApp
      JwtSettings__Audience: CloudServiceUsers
      JwtSettings__ExpirationInMinutes: "1440"
      DemoPayment__Enabled: "true"
      Database__AutoMigrate: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./cloud-service-frontend
      dockerfile: Dockerfile
    container_name: cloudservice-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_PROXY_URL: http://api:8080
    depends_on:
      - api

volumes:
  sqlserver_data:
